name: Build and release CortexState packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build
      - run: python -m build
      - run: npm pack --pack-destination ../../dist
        working-directory: sdk/javascript
      - uses: actions/upload-artifact@v4
        with:
          name: cortexstate-core
          path: dist/*

  native-rank:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install maturin
      - run: python -c "from pathlib import Path; Path('../work/rust-wheel').mkdir(parents=True, exist_ok=True)"
        working-directory: rust
      - run: maturin build --release --features python --out ../work/rust-wheel
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: cortexstate-rank-${{ matrix.os }}-py${{ matrix.python }}
          path: work/rust-wheel/*.whl

  release:
    needs: [core, native-rank]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cortexstate-core
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cortexstate-rank-*
          path: dist
          merge-multiple: true
      - name: Attach packages to the matching release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(dist/cortexstate-${version}-*.whl dist/cortexstate-${version}.tar.gz dist/cortexstate-client-${version}.tgz dist/cortexstate_rank-${version}-*.whl)
          notes="docs/releases/v${version}.md"
          if [[ ! -f "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --latest
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --title "CortexState ${GITHUB_REF_NAME}" --notes-file "${notes}" --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cortexstate-release-packages
          path: dist/*
