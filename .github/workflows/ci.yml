name: CortexState checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install . maturin
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: python -c "from pathlib import Path; Path('work/rust-wheel').mkdir(parents=True, exist_ok=True)"
      - run: maturin build --release --features python --out ../work/rust-wheel
        working-directory: rust
      - run: python -m pip install --no-index --find-links work/rust-wheel cortexstate-rank
      - run: python -m unittest discover -s tests -v
      - run: node --test sdk/javascript/test.mjs
      - run: node --check cortexstate/dashboard/app.js
      - run: python -m pip wheel --no-deps --wheel-dir work/wheels .
      - run: npm pack --pack-destination ../../work
        working-directory: sdk/javascript
      - run: python -m examples.quickstart
      - run: python -m examples.support_workflow
      - run: python -m evals.run --out work/eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.os }}-${{ matrix.python }}
          path: |
            work/eval.json
            work/wheels/*
            work/rust-wheel/*
            work/*.tgz
