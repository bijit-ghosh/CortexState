[package]
name = "cortexstate-rank"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Optional deterministic BM25 scoring core for CortexState"

[lib]
name = "_rust_rank"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[features]
default = []
python = ["dep:pyo3"]
