[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexstate"
version = "0.4.0"
description = "Inspectable, scoped memory and evidence-gated improvement for AI applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bijit Ghosh"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["cortexstate*"]

[tool.setuptools.package-data]
cortexstate = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js", "py.typed"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]

[project.scripts]
cortexstate = "cortexstate.cli:main"

[project.urls]
Homepage = "https://github.com/bijit-ghosh/CortexState"
Documentation = "https://github.com/bijit-ghosh/CortexState/tree/main/docs"
Issues = "https://github.com/bijit-ghosh/CortexState/issues"
