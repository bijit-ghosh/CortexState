<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">CortexState continual learning architecture for coding agents</title>
  <desc id="desc">A technical flow diagram showing repository context retrieval, coding and verification gates, evidence-linked deployment learning, reviewed memory promotion, and an optional offline reinforcement-learning lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10243a"/></linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16384b"/><stop offset="1" stop-color="#102b3b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020915" flood-opacity=".35"/></filter>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#66e2c0"/></marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#8db8ff"/></marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#c3a5ff"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}
      .eyebrow{font-size:18px;font-weight:800;letter-spacing:2.2px}
      .title{font-size:44px;font-weight:800;letter-spacing:-1px}
      .subtitle{font-size:22px;fill:#b4c3d3}
      .lane{font-size:19px;font-weight:800;letter-spacing:1.7px}
      .nodeTitle{font-size:20px;font-weight:800}
      .copy{font-size:16px;fill:#b9c8d8}
      .small{font-size:14px;fill:#9eb0c2}
      .callout{font-size:16px;font-weight:700}
      .card{fill:#13263a;stroke:#29445c;stroke-width:2}
      .rule{stroke:#29445c;stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1120" rx="34" fill="url(#bg)"/>
  <circle cx="1660" cy="55" r="300" fill="#142c43" opacity=".42"/>
  <circle cx="35" cy="1075" r="250" fill="#102a39" opacity=".4"/>
  <rect x="24" y="24" width="1752" height="1072" rx="28" fill="none" stroke="#274158" stroke-width="2"/>

  <text x="68" y="78" class="eyebrow" fill="#66e2c0">CORTEXSTATE  /  CONTINUAL LEARNING</text>
  <text x="68" y="137" class="title">Turn task experience into verified memory</text>
  <text x="68" y="176" class="subtitle">One scoped memory contract across models, harnesses, repositories, and skills.</text>
  <rect x="1420" y="62" width="300" height="42" rx="21" fill="#142f40" stroke="#31576a"/>
  <text x="1570" y="89" text-anchor="middle" font-size="15" font-weight="800" fill="#8db8ff">MODEL-NEUTRAL · SCOPED MEMORY</text>

  <!-- Online context and execution lane -->
  <text x="68" y="235" class="lane" fill="#66e2c0">01  /  BEFORE AND DURING THE TASK</text>
  <text x="1720" y="235" text-anchor="end" class="small">The host owns identity, policy, and command execution</text>
  <line x1="68" y1="252" x2="1732" y2="252" class="rule"/>

  <g filter="url(#shadow)">
    <rect x="68" y="286" width="230" height="148" rx="20" class="card"/>
    <rect x="322" y="286" width="230" height="148" rx="20" class="card"/>
    <rect x="576" y="286" width="230" height="148" rx="20" fill="url(#memory)" stroke="#4fbaa9" stroke-width="2"/>
    <rect x="830" y="286" width="230" height="148" rx="20" class="card"/>
    <rect x="1084" y="286" width="230" height="148" rx="20" class="card"/>
    <rect x="1338" y="286" width="230" height="148" rx="20" class="card"/>
  </g>
  <path d="M298 360H314M552 360H568M806 360H822M1060 360H1076M1314 360H1330" fill="none" stroke="#66e2c0" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <text x="88" y="326" class="nodeTitle">1. Identify</text><text x="88" y="359" class="copy"><tspan x="88">Repository · branch</tspan><tspan x="88" dy="23">model · harness · skill</tspan><tspan x="88" dy="23">stable project scope</tspan></text>
  <text x="342" y="326" class="nodeTitle">2. Check freshness</text><text x="342" y="359" class="copy"><tspan x="342">Validate rule source path</tspan><tspan x="342" dy="23">and source revision</tspan><tspan x="342" dy="23">refresh stale entries</tspan></text>
  <text x="596" y="326" class="nodeTitle">3. Retrieve memory</text><text x="596" y="359" class="copy"><tspan x="596">Architecture rules · tests</tspan><tspan x="596" dy="23">security constraints</tspan><tspan x="596" dy="23">small task context budget</tspan></text>
  <text x="850" y="326" class="nodeTitle">4. Implement</text><text x="850" y="359" class="copy"><tspan x="850">Agent edits under host</tspan><tspan x="850" dy="23">instructions and tool policy</tspan><tspan x="850" dy="23">memory remains untrusted</tspan></text>
  <text x="1104" y="326" class="nodeTitle">5. Verify</text><text x="1104" y="359" class="copy"><tspan x="1104">Tests · lint · security</tspan><tspan x="1104" dy="23">permission policy · diff</tspan><tspan x="1104" dy="23">host runs deterministic gates</tspan></text>
  <text x="1358" y="326" class="nodeTitle">6. Gate the PR</text><text x="1358" y="359" class="copy"><tspan x="1358">Pass all required checks</tspan><tspan x="1358" dy="23">then allow review</tspan><tspan x="1358" dy="23">failed check returns to edit</tspan></text>

  <path d="M1210 434V468H945V440" fill="none" stroke="#f5c77e" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>
  <rect x="1018" y="451" width="335" height="34" rx="17" fill="#342d24" stroke="#766044"/>
  <text x="1185" y="474" text-anchor="middle" class="callout" fill="#f5c77e">FAIL? Revise code, rerun the same check</text>

  <!-- Evidence-to-memory lane -->
  <text x="68" y="536" class="lane" fill="#8db8ff">02  /  LEARN FROM DEPLOYMENT EVIDENCE</text>
  <text x="1720" y="536" text-anchor="end" class="small">Candidate memory stays staged until evaluation and approval</text>
  <line x1="68" y1="553" x2="1732" y2="553" class="rule"/>

  <g filter="url(#shadow)">
    <rect x="68" y="585" width="238" height="132" rx="18" class="card"/>
    <rect x="344" y="585" width="238" height="132" rx="18" class="card"/>
    <rect x="620" y="585" width="238" height="132" rx="18" class="card"/>
    <rect x="896" y="585" width="238" height="132" rx="18" class="card"/>
    <rect x="1172" y="585" width="238" height="132" rx="18" class="card"/>
    <rect x="1448" y="585" width="238" height="132" rx="18" fill="url(#memory)" stroke="#4fbaa9" stroke-width="2"/>
  </g>
  <path d="M306 651H336M582 651H612M858 651H888M1134 651H1164M1410 651H1440" fill="none" stroke="#8db8ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="88" y="623" class="nodeTitle">1. Capture</text><text x="88" y="655" class="copy"><tspan x="88">Consent · redact</tspan><tspan x="88" dy="23">outcome · versions</tspan><tspan x="88" dy="23">tokens · latency · checks</tspan></text>
  <text x="364" y="623" class="nodeTitle">2. Scope evidence</text><text x="364" y="655" class="copy"><tspan x="364">Tenant · project · agent</tspan><tspan x="364" dy="23">source IDs · provenance</tspan><tspan x="364" dy="23">no raw transcript by default</tspan></text>
  <text x="640" y="623" class="nodeTitle">3. Stage a lesson</text><text x="640" y="655" class="copy"><tspan x="640">Link repeatable evidence</tspan><tspan x="640" dy="23">review · revise · reject</tspan><tspan x="640" dy="23">no silent memory writes</tspan></text>
  <text x="916" y="623" class="nodeTitle">4. Evaluate</text><text x="916" y="655" class="copy"><tspan x="916">Frozen baseline + candidate</tspan><tspan x="916" dy="23">held-out task suite</tspan><tspan x="916" dy="23">success · safety · cost</tspan></text>
  <text x="1192" y="623" class="nodeTitle">5. Approve</text><text x="1192" y="655" class="copy"><tspan x="1192">No reported safety regressions</tspan><tspan x="1192" dy="23">no quality / token / latency loss</tspan><tspan x="1192" dy="23">authorized reviewer</tspan></text>
  <text x="1468" y="623" class="nodeTitle">6. Promote / roll back</text><text x="1468" y="655" class="copy"><tspan x="1468">Versioned scoped memory</tspan><tspan x="1468" dy="23">recalled on relevant work</tspan><tspan x="1468" dy="23">rollback if evidence regresses</tspan></text>

  <!-- Explicit learning feedback to the next task's recall. -->
  <path d="M1567 717V790H1730V270H690V278" fill="none" stroke="#66e2c0" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <rect x="1100" y="771" width="405" height="36" rx="18" fill="#102d34" stroke="#397367"/>
  <text x="1302" y="795" text-anchor="middle" class="callout" fill="#82e3c8">Approved lesson enters memory for the next task</text>

  <!-- Optional RL is a distinct model-owner-controlled training path. -->
  <text x="68" y="842" class="lane" fill="#c3a5ff">03  /  OPTIONAL OFFLINE RL FOR TRAINABLE WEIGHTS</text>
  <text x="1720" y="842" text-anchor="end" font-size="15" font-weight="700" fill="#f5c77e">No rollout service or trainer ships in this preview</text>
  <line x1="68" y1="860" x2="1732" y2="860" class="rule"/>
  <text x="95" y="909" class="copy">Curated episodes</text><text x="95" y="938" class="small">redacted · versioned</text>
  <path d="M280 918H495" fill="none" stroke="#c3a5ff" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="520" y="909" class="copy">Actor + memory writer</text><text x="520" y="938" class="small">current-task and delayed utility</text>
  <path d="M770 918H970" fill="none" stroke="#c3a5ff" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="995" y="909" class="copy">Hard safety gate + holdout</text><text x="995" y="938" class="small">matched streams · canary</text>
  <path d="M1270 918H1450" fill="none" stroke="#c3a5ff" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="1475" y="909" class="copy">Owner deploys policy</text><text x="1475" y="938" class="small">only after independent review</text>

  <line x1="68" y1="985" x2="1732" y2="985" stroke="#29445c" stroke-width="1"/>
  <text x="68" y="1024" class="small">CortexState stores, retrieves, and gates memory changes. The host executes code and owns authorization, evaluation, and deployment.</text>
  <text x="1720" y="1062" text-anchor="end" font-size="14" font-weight="700" fill="#8db8ff">SCOPED MEMORY · EVIDENCE-GATED LEARNING · HOST-CONTROLLED DEPLOYMENT</text>
</svg>
