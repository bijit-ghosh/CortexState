<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">CortexState — inspectable memory for AI applications</title>
  <desc id="desc">An original visualization of an application writing scoped facts to CortexState, retrieving relevant context, and maintaining revision history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#172b46"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65e0bd"/><stop offset="1" stop-color="#78a9ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#07111f" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1070" cy="65" r="175" fill="#376b8d" opacity=".13"/><circle cx="1205" cy="320" r="190" fill="#35c9a1" opacity=".08"/>
  <g fill="none" stroke="url(#glow)" stroke-width="3" opacity=".88">
    <path d="M345 177H470"/><path d="M600 177H710"/><path d="M870 177H973"/>
    <path d="M957 169l16 8-16 8"/><path d="M694 169l16 8-16 8"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="66" y="119" width="279" height="116" rx="18" fill="#1e3048" stroke="#49647d"/>
    <rect x="470" y="119" width="245" height="116" rx="18" fill="#1e3048" stroke="#5acdb0"/>
    <rect x="710" y="119" width="160" height="116" rx="18" fill="#1e3048" stroke="#718fe4"/>
    <rect x="973" y="119" width="241" height="116" rx="18" fill="#1e3048" stroke="#49647d"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="66" y="73" fill="#f3f7fb" font-size="34" font-weight="700">CortexState</text>
    <text x="66" y="101" fill="#a9bbce" font-size="17">Inspectable memory for AI applications</text>
    <text x="205" y="161" fill="#79e5cb" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">YOUR APPLICATION</text>
    <text x="205" y="194" fill="#f3f7fb" font-size="18" font-weight="600" text-anchor="middle">Choose · Scope · Recall</text>
    <text x="592" y="161" fill="#79e5cb" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">CORTEXSTATE CORE</text>
    <text x="592" y="194" fill="#f3f7fb" font-size="18" font-weight="600" text-anchor="middle">Validate · Rank · Bound</text>
    <text x="790" y="161" fill="#9bb5ff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.1">SQLITE</text>
    <text x="790" y="194" fill="#f3f7fb" font-size="17" font-weight="600" text-anchor="middle">Facts + history</text>
    <text x="1093" y="161" fill="#79e5cb" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">CONTROL</text>
    <text x="1093" y="194" fill="#f3f7fb" font-size="18" font-weight="600" text-anchor="middle">Inspect · Revise · Forget</text>
    <text x="66" y="306" fill="#a9bbce" font-size="15">Python APIs · TypeScript SDK · Optional Rust BM25 acceleration · Local-first storage</text>
    <text x="1214" y="306" fill="#79e5cb" font-size="13" text-anchor="end">BY BIJIT GHOSH</text>
  </g>
  <g fill="#71e1c5"><circle cx="389" cy="177" r="4"/><circle cx="430" cy="177" r="4"/><circle cx="910" cy="177" r="4"/></g>
</svg>
