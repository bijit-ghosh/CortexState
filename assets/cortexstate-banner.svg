<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">CortexState — shared memory and evidence-gated learning across agent stacks</title>
  <desc id="desc">Model-, harness-, and skill-neutral architecture: applications use Python, TypeScript, or HTTP to record outcomes, stage lessons, evaluate them externally against a protected baseline, and promote approved improvements to scoped memory. CortexState also provides inspectable retrieval, an operator dashboard, and optional Rust BM25 scoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1727"/><stop offset=".58" stop-color="#14243a"/><stop offset="1" stop-color="#1a3048"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64e1c2"/><stop offset="1" stop-color="#8db2ff"/></linearGradient>
    <linearGradient id="read" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8bb4ff"/><stop offset="1" stop-color="#7ae2c4"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#050b14" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#65ddbf"/></marker>
    <marker id="arrowRead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#8db2ff"/></marker>
  </defs>

  <rect width="1600" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="245" fill="#4c87a7" opacity=".09"/>
  <circle cx="1500" cy="640" r="250" fill="#36cda7" opacity=".07"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="58" y="68" fill="#f2f7fb" font-size="38" font-weight="750" letter-spacing="-.6">CortexState</text>
    <text x="60" y="103" fill="#bdcad8" font-size="19">Shared memory and evidence-gated improvement across models, harnesses, and skills.</text>
    <rect x="1285" y="43" width="255" height="38" rx="19" fill="#20364c" stroke="#38536d"/>
    <circle cx="1308" cy="62" r="5" fill="#65dfc1"/>
    <text x="1322" y="68" fill="#c9d8e5" font-size="13" font-weight="700" letter-spacing="1">LOCAL-FIRST · PROVIDER-NEUTRAL</text>

    <text x="60" y="151" fill="#78e1c6" font-size="13" font-weight="750" letter-spacing="1.7">ONE SHARED MEMORY AND LEARNING PATH</text>
    <text x="1540" y="151" fill="#91a7ba" font-size="13" text-anchor="end">DEPLOY  →  MEASURE  →  EVALUATE  →  APPROVE  →  RECALL</text>

    <!-- Main architecture path -->
    <g filter="url(#shadow)">
      <rect x="50" y="177" width="190" height="196" rx="18" fill="#1b3047" stroke="#45627c"/>
      <rect x="275" y="177" width="190" height="196" rx="18" fill="#1b3047" stroke="#45627c"/>
      <rect x="500" y="177" width="190" height="196" rx="18" fill="#1b3047" stroke="#51bca4"/>
      <rect x="725" y="177" width="190" height="196" rx="18" fill="#1b3047" stroke="#748fd6"/>
      <rect x="950" y="177" width="190" height="196" rx="18" fill="#1b3047" stroke="#748fd6"/>
      <rect x="1175" y="177" width="190" height="196" rx="18" fill="#1b3047" stroke="#51bca4"/>
      <rect x="1400" y="177" width="150" height="196" rx="18" fill="#1b3047" stroke="#45627c"/>
    </g>
    <g fill="none" stroke="#65ddbf" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M242 274h27"/><path d="M467 274h27"/><path d="M692 274h27"/><path d="M917 274h27"/><path d="M1142 274h27"/><path d="M1367 274h27"/>
    </g>
    <g text-anchor="middle">
      <text x="145" y="213" fill="#74e2c8" font-size="12" font-weight="750" letter-spacing="1.4">01 · YOUR APP</text>
      <text x="145" y="247" fill="#f4f7fa" font-size="18" font-weight="700">Agent or backend</text>
      <text x="145" y="283" fill="#bfd0df" font-size="14">Chooses what to save</text>
      <text x="145" y="305" fill="#bfd0df" font-size="14">and when to recall</text>
      <text x="145" y="342" fill="#89a2b8" font-size="12">Policy stays with you</text>

      <text x="370" y="213" fill="#74e2c8" font-size="12" font-weight="750" letter-spacing="1.2">02 · CLIENTS</text>
      <text x="370" y="247" fill="#f4f7fa" font-size="18" font-weight="700">Python · TypeScript</text>
      <text x="370" y="283" fill="#bfd0df" font-size="14">Embedded library or</text>
      <text x="370" y="305" fill="#bfd0df" font-size="14">authenticated HTTP API</text>
      <text x="370" y="342" fill="#89a2b8" font-size="12">API key assigns tenant</text>

      <text x="595" y="213" fill="#74e2c8" font-size="12" font-weight="750" letter-spacing="1.2">03 · POLICY CORE</text>
      <text x="595" y="247" fill="#f4f7fa" font-size="18" font-weight="700">Validate each change</text>
      <text x="595" y="283" fill="#bfd0df" font-size="14">Exact scope · provenance</text>
      <text x="595" y="305" fill="#bfd0df" font-size="14">Idempotency · revisions</text>
      <text x="595" y="342" fill="#89a2b8" font-size="12">No silent model writes</text>

      <text x="820" y="213" fill="#a9bcff" font-size="12" font-weight="750" letter-spacing="1.4">04 · SQLITE</text>
      <text x="820" y="247" fill="#f4f7fa" font-size="18" font-weight="700">Facts + history</text>
      <text x="820" y="283" fill="#bfd0df" font-size="14">Metadata · vectors · TTL</text>
      <text x="820" y="305" fill="#bfd0df" font-size="14">WAL · indexed cleanup</text>
      <text x="820" y="342" fill="#89a2b8" font-size="12">Local persistent store</text>

      <text x="1045" y="213" fill="#a9bcff" font-size="12" font-weight="750" letter-spacing="1.3">05 · RETRIEVAL</text>
      <text x="1045" y="247" fill="#f4f7fa" font-size="18" font-weight="700">Filter, then rank</text>
      <text x="1045" y="283" fill="#bfd0df" font-size="14">Scope · expiry · metadata</text>
      <text x="1045" y="305" fill="#bfd0df" font-size="14">BM25 · optional vectors</text>
      <text x="1045" y="342" fill="#89a2b8" font-size="12">Rust batch or Python</text>

      <text x="1270" y="213" fill="#74e2c8" font-size="12" font-weight="750" letter-spacing="1.2">06 · CONTEXT</text>
      <text x="1270" y="247" fill="#f4f7fa" font-size="18" font-weight="700">Pack for the caller</text>
      <text x="1270" y="283" fill="#bfd0df" font-size="14">Ranked, bounded facts</text>
      <text x="1270" y="305" fill="#bfd0df" font-size="14">Exact character budget</text>
      <text x="1270" y="342" fill="#ffc98c" font-size="12">Marked untrusted data</text>

      <text x="1475" y="213" fill="#74e2c8" font-size="12" font-weight="750" letter-spacing="1.1">07 · RETURN</text>
      <text x="1475" y="247" fill="#f4f7fa" font-size="17" font-weight="700">Your prompt</text>
      <text x="1475" y="283" fill="#bfd0df" font-size="13">App decides</text>
      <text x="1475" y="305" fill="#bfd0df" font-size="13">what to include</text>
      <text x="1475" y="342" fill="#89a2b8" font-size="12">Model choice is yours</text>
    </g>

    <!-- Extension points and operating guarantees -->
    <path d="M595 374v39" fill="none" stroke="#73dfc2" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M370 374v39" fill="none" stroke="#73dfc2" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M1045 374v39" fill="none" stroke="#91aaff" stroke-width="2" stroke-dasharray="5 6"/>

    <g filter="url(#shadow)">
      <rect x="50" y="423" width="465" height="166" rx="17" fill="#182c43" stroke="#395a70"/>
      <rect x="567" y="423" width="465" height="166" rx="17" fill="#182c43" stroke="#397966"/>
      <rect x="1084" y="423" width="466" height="166" rx="17" fill="#182c43" stroke="#526a9a"/>
    </g>
    <g>
      <text x="76" y="460" fill="#9fb8ce" font-size="12" font-weight="750" letter-spacing="1.5">OPERATOR CONTROL</text>
      <text x="76" y="493" fill="#f2f7fb" font-size="20" font-weight="700">Live dashboard</text>
      <text x="76" y="523" fill="#c1d0dd" font-size="14">Inspect records and scores; revise with conflict checks;</text>
      <text x="76" y="545" fill="#c1d0dd" font-size="14">review history and purge expired data. Trusted operators</text>
      <text x="76" y="567" fill="#c1d0dd" font-size="14">only; keep the service behind your access-controlled gateway.</text>

      <text x="593" y="460" fill="#8ce2ce" font-size="12" font-weight="750" letter-spacing="1.5">LEARN FROM DEPLOYMENT</text>
      <text x="593" y="493" fill="#f2f7fb" font-size="20" font-weight="700">Improve with evidence</text>
      <text x="593" y="523" fill="#c1d0dd" font-size="14">Record outcomes, stage a reusable lesson, compare it</text>
      <text x="593" y="545" fill="#c1d0dd" font-size="14">to a frozen baseline, then review before promotion.</text>
      <text x="593" y="567" fill="#c1d0dd" font-size="14">Your evaluator runs the comparison.</text>

      <text x="1110" y="460" fill="#a8bdff" font-size="12" font-weight="750" letter-spacing="1.5">PERFORMANCE, WITH A FALLBACK</text>
      <text x="1110" y="493" fill="#f2f7fb" font-size="20" font-weight="700">Rust where it fits</text>
      <text x="1110" y="523" fill="#c1d0dd" font-size="14">Optional Rust batch scoring for BM25; Python remains</text>
      <text x="1110" y="545" fill="#c1d0dd" font-size="14">the portable reference path. CI checks score parity.</text>
      <text x="1110" y="567" fill="#c1d0dd" font-size="14">Measure on your data before claiming a speedup.</text>
    </g>

    <path d="M60 624H1540" stroke="#3b5369" stroke-width="1"/>
    <text x="60" y="660" fill="#b3c4d3" font-size="14">Exact scope · revision-checked writes · explicit retention · bounded context · inspectable retrieval</text>
    <text x="1540" y="660" fill="#72dfc4" font-size="13" font-weight="750" text-anchor="end" letter-spacing="1">BUILT BY BIJIT GHOSH · CORTEXSTATE 0.4</text>
  </g>
</svg>
