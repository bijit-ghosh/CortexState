services:
  cortexstate:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CORTEXSTATE_KEYS: ${CORTEXSTATE_KEYS:?Set CORTEXSTATE_KEYS to a JSON mapping of secrets to tenants}
    volumes:
      - cortexstate-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  cortexstate-data:
